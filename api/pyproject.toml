[project]
name = "scholarql-api"
version = "0.1.0"
description = "ScholarQL FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "ruff==0.17.2",  # keep in sync with RUFF_VERSION in .github/workflows/ci.yml
]

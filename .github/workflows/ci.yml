# Runs on every push to main and every pull request.
# Three independent jobs run in parallel; a PR should only merge when all are green.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run of the same branch/PR when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUFF_VERSION: "0.17.2"  # keep in sync with api/pyproject.toml

jobs:
  python:
    name: Python (Ruff, lockfiles, tests)
    runs-on: ubuntu-latest
    # A real PostgreSQL with A's schema and B's pilot data for the papers and engine tests
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scholarql
          POSTGRES_PASSWORD: scholarql
          POSTGRES_DB: scholarql
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scholarql" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: scholarql
      PGPASSWORD: scholarql
      PGDATABASE: scholarql
      TEST_DATABASE_URL: postgresql://scholarql:scholarql@localhost:5432/scholarql
      TEST_READER_URL: postgresql://scholarql_reader:ci_reader@localhost:5432/scholarql
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes only full version tags (no floating @v10), so pin the exact release
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      # Lints every Python file in the repo using the root ruff.toml
      - name: Ruff lint
        run: uvx ruff@${{ env.RUFF_VERSION }} check --output-format=github .

      - name: Ruff format check
        run: uvx ruff@${{ env.RUFF_VERSION }} format --check .

      # Fails if someone edited pyproject.toml without re-running `uv lock`
      - name: Lockfiles are up to date
        run: |
          (cd api && uv lock --check)
          (cd jobs && uv lock --check)
          (cd pipeline && uv lock --check)

      # Same steps as db/init does in Docker
      - name: Load A's schema, B's pilot data and the reader role
        run: |
          sed -n '/^-- migrate:up/,/^-- migrate:down/p' db/migrations/*.sql | psql -v ON_ERROR_STOP=1 -q
          psql -v ON_ERROR_STOP=1 -q -f db/seed/pilot.sql
          SCHOLARQL_READER_PASSWORD=ci_reader psql -v ON_ERROR_STOP=1 -q -f db/roles/reader.sql

      - name: API tests
        working-directory: api
        run: uv run --frozen pytest -q

      # B's own tests (SQLite pilot), run in the API environment that installs the engine
      - name: Engine tests
        working-directory: api
        run: uv run --frozen python -m unittest discover -s ../engine/tests

      # Contract check: the committed spec must match what FastAPI generates now
      - name: OpenAPI spec is up to date
        working-directory: api
        run: |
          uv run --frozen python scripts/export_openapi.py
          git diff --exit-code ../web/lib/openapi.json || {
            echo "::error::web/lib/openapi.json is stale. Run: cd api && uv run python scripts/export_openapi.py && cd ../web && pnpm gen:api"
            exit 1
          }

  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version from web/package.json's "packageManager" field
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Contract check: the committed TypeScript types must match the committed spec
      - name: API types are up to date
        run: |
          pnpm gen:api
          git diff --exit-code lib/api-types.ts || {
            echo "::error::web/lib/api-types.ts is stale. Run: cd web && pnpm gen:api"
            exit 1
          }

      - name: Lint
        run: pnpm lint

      # `next build` also type-checks, so TypeScript errors fail here
      - name: Build
        run: pnpm build

  compose:
    name: Docker Compose + Playwright smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      # Same command a teammate runs on a fresh clone; --wait blocks until healthchecks pass
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Check API and web respond
        run: |
          curl --fail --silent --show-error http://localhost:8000/health
          curl --fail --silent --show-error --output /dev/null http://localhost:3000

      # End-to-end smoke tests in a real browser against the running stack (databases empty)
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Playwright
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Playwright smoke tests
        working-directory: web
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

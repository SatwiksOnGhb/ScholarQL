# Runs on every push to main and every pull request.
# Three independent jobs run in parallel; a PR should only merge when all are green.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run of the same branch/PR when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUFF_VERSION: "0.17.2"  # keep in sync with api/pyproject.toml

jobs:
  python:
    name: Python (Ruff + lockfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes only full version tags (no floating @v10), so pin the exact release
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      # Lints every Python file in the repo using the root ruff.toml
      - name: Ruff lint
        run: uvx ruff@${{ env.RUFF_VERSION }} check --output-format=github .

      - name: Ruff format check
        run: uvx ruff@${{ env.RUFF_VERSION }} format --check .

      # Fails if someone edited pyproject.toml without re-running `uv lock`
      - name: API lockfile is up to date
        working-directory: api
        run: uv lock --check

      # TODO: add `uv run pytest` here once the API has tests

  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version from web/package.json's "packageManager" field
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `next build` also type-checks, so TypeScript errors fail here
      - name: Build
        run: pnpm build

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      # Same command a teammate runs on a fresh clone; --wait blocks until healthchecks pass
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Check API and web respond
        run: |
          curl --fail --silent --show-error http://localhost:8000/health
          curl --fail --silent --show-error --output /dev/null http://localhost:3000

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

[project]
name = "scholarql-api"
version = "0.1.0"
description = "ScholarQL FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pymongo>=4.19.0",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff==0.17.2",  # keep in sync with RUFF_VERSION in .github/workflows/ci.yml
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
